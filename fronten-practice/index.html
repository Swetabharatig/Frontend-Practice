<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Registration Form</title>
    </head>

    <body>
        <header>
            <h1>Application Form</h1>
            <p>
                Lorem ipsum dolor sit amet, consectetur adipisicing elit. Harum
                delectus quisquam sequi deleniti, sit facere.
            </p>
        </header>
        <main>
            <hr />
            <section aria-label="Application-information">
                <h2>Registration Form</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
                <form>
                    <div>
                        <label for="username">Username *</label>
                        <input
                            type="text"
                            name="username"
                            id="username"
                            placeholder="Enter your username"
                            minlength="3"
                            maxlength="20"
                            required
                        />
                    </div>

                    <div>
                        <label for="email">Email *</label>
                        <input
                            type="email"
                            name="email"
                            placeholder="Enter your email address"
                            id="email"
                            required
                        />
                    </div>

                    <div>
                        <label for="contact">Contact *</label>
                        <input
                            type="tel"
                            name="contact"
                            placeholder="Enter your phone number"
                            id="contact"
                            minlength="8"
                            maxlength="15"
                            required
                        />
                    </div>

                    <div>
                        <label for="date-of-birth">Date of Birth*</label>
                        <input
                            type="date"
                            name="date-of-birth"
                            id="date-of-birth"
                            required
                        />
                    </div>

                    <div>
                        <label for="address">Address*</label>
                        <br />
                        <textarea
                            name="address"
                            placeholder="Enter your address"
                            id="address"
                            rows="3"
                            maxlength="100"
                        ></textarea>
                    </div>

                    <div>
                        <span>Gender</span>
                        <div>
                            <input type="radio" name="gender" id="male" />
                            <label for="male">Male</label>
                        </div>
                        <div>
                            <input type="radio" name="gender" id="female" />
                            <label for="female">Female</label>
                        </div>
                        <div>
                            <input type="radio" name="gender" id="other" />
                            <label for="other">Other</label>
                        </div>
                    </div>

                    <div>
                        <label for="feedback">Feedback</label>
                        <br />
                        <textarea
                            name="feedback"
                            placeholder="Share your feedback"
                            id="feedback"
                            rows="5"
                            maxlength="1000"
                        ></textarea>
                    </div>

                    <div>
                        <span>Concent</span>
                        <div>
                            <input
                                type="checkbox"
                                name="terms-accepted"
                                id="terms-&-conditions"
                                required
                            />
                            <label for="terms-&-conditions"
                                >Terms & Conditions : Lorem ipsum dolor, sit
                                amet consectetur adipisicing elit. Iure,
                                numquam.</label
                            >
                        </div>
                    </div>

                    <div>
                        <button type="submit">Submit Application</button>
                        <button type="reset">Reset Application</button>
                    </div>
                </form>
            </section>
            <hr />
        </main>

        <footer>
            <p>&copy;2026 Application form. All rights are reserved.</p>
        </footer>
    </body>
</html>
